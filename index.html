<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menu des thés</title>
  <meta name="description" content="Le menu des thés disponibles à la maison">
  <meta name="theme-color" content="#3f5a3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thés">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Menu des thés</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <input id="search" type="search" placeholder="Rechercher un thé…" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="tablist"></div>
  </header>

  <main id="list" class="list" aria-live="polite"></main>

  <button class="fab" id="addBtn" aria-label="Ajouter un thé">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  </button>

  <!-- Formulaire ajout / édition -->
  <dialog id="teaDialog" class="sheet">
    <form id="teaForm" method="dialog">
      <div class="sheet-head">
        <button type="button" class="link" data-close>Annuler</button>
        <h2 id="formTitle">Nouveau thé</h2>
        <button type="submit" class="link strong">Enregistrer</button>
      </div>
      <div class="sheet-body">
        <label>Nom
          <input name="name" required maxlength="80" placeholder="ex. Sencha Kagoshima" autocomplete="off">
        </label>
        <label>Type
          <select name="type" id="typeSelect"></select>
        </label>
        <label>Origine / marque
          <input name="origin" maxlength="80" placeholder="ex. Japon, Mariage Frères…" autocomplete="off">
        </label>
        <div class="row">
          <label>Température (°C)
            <input name="temp" type="number" inputmode="numeric" min="40" max="100" step="1" placeholder="80">
          </label>
          <label>Infusion (min)
            <input name="time" type="number" inputmode="decimal" min="0" max="60" step="0.5" placeholder="3">
          </label>
        </div>
        <label>Notes
          <textarea name="notes" rows="3" maxlength="500" placeholder="Goût, moment idéal, dosage…"></textarea>
        </label>
        <label class="toggle">
          <input type="checkbox" name="inStock" checked>
          <span>Disponible à la maison</span>
        </label>
        <button type="button" class="danger" id="deleteBtn" hidden>Supprimer ce thé</button>
      </div>
    </form>
  </dialog>

  <!-- Réglages -->
  <dialog id="settingsDialog" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2>Réglages</h2>
      <button type="button" class="link strong" data-close>OK</button>
    </div>
    <div class="sheet-body">
      <label class="toggle">
        <input type="checkbox" id="showOut">
        <span>Afficher aussi les thés épuisés</span>
      </label>
      <h3>Sauvegarde</h3>
      <p class="hint">La liste est enregistrée uniquement sur ce téléphone. Exportez-la de temps en temps pour la garder en sécurité ou la copier sur un autre appareil.</p>
      <button type="button" class="secondary" id="exportBtn">Exporter la liste (.json)</button>
      <label class="secondary file-btn">Importer une liste…
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
      <p class="hint small" id="countInfo"></p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
